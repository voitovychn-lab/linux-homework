controller:
  admin:
    username: admin

  serviceType: ClusterIP
  servicePort: 8080

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - credentials-binding
    - github
    - job-dsl

persistence:
  enabled: true
  storageClass: "gp2"
  size: 10Gi